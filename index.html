<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>輪郭美人への7つの鍵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: 1カラムの縦長「招待状」。スマホ幅を基準に、広い余白と細い金のラインで区切る。
   ブランドの世界観を固定するため、あえてライトテーマ1種のみ。 */
:root {
  color-scheme: light;
  --ivory: #FAF7F2;
  --pink: #E8CFD0;
  --pink-soft: #F4E7E6;
  --gold: #C6A77D;
  --gold-deep: #94764A;      /* 小さな文字用に濃くしたゴールド */
  --brown: #65564F;
  --brown-soft: #8A7B73;
  --white: #FFFFFF;
  --line: rgba(198, 167, 125, 0.4);
  --shadow: 0 10px 30px rgba(101, 86, 79, 0.08);
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-latin: "Cormorant Garamond", "Shippori Mincho", serif;
  --radius: 20px;
}
* { box-sizing: border-box; }
body {
  background: var(--ivory);
  color: var(--brown);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.9;
  letter-spacing: 0.04em;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 30rem;
  margin: 0 auto;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  min-height: 100%;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; text-wrap: balance; line-height: 1.5; }
button { font: inherit; color: inherit; letter-spacing: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 3px; }

.stack { display: flex; flex-direction: column; }
.view { display: flex; flex-direction: column; gap: 36px; animation: fadeUp .6s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.eyebrow {
  font-family: var(--font-latin); font-size: 13px; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--gold-deep);
}
.rule { display: flex; align-items: center; gap: 12px; color: var(--gold); }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.muted { color: var(--brown-soft); font-size: 13px; line-height: 1.8; }

/* ボタン */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 56px; padding: 12px 24px;
  border-radius: 999px; border: 1px solid var(--brown);
  background: var(--brown); color: var(--ivory);
  font-family: var(--font-display); font-size: 16px; letter-spacing: 0.14em;
  transition: transform .2s ease, opacity .2s ease, background .2s ease;
}
.btn:active { transform: scale(0.985); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--brown); border-color: var(--gold); }
.linkbtn {
  background: none; border: 0; padding: 10px 4px; min-height: 44px;
  color: var(--brown-soft); font-size: 13px; text-decoration: underline; text-underline-offset: 4px;
}
.back {
  background: none; border: 0; padding: 8px 0; min-height: 44px; align-self: flex-start;
  color: var(--brown-soft); font-size: 13px; display: flex; align-items: center; gap: 6px;
}

/* ウェルカム */
.hero { align-items: center; text-align: center; gap: 22px; padding-top: 12px; }
.hero h1 { font-size: clamp(27px, 8vw, 34px); letter-spacing: 0.1em; }
.hero .sub { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.14em; color: var(--brown-soft); }
.arch {
  width: min(64%, 220px); aspect-ratio: 3 / 4; max-width: 100%;
  border-radius: 999px 999px 14px 14px;
  background: linear-gradient(180deg, var(--pink-soft), var(--pink));
  position: relative; display: grid; place-items: center;
  box-shadow: var(--shadow);
}
.arch::after {
  content: ""; position: absolute; inset: 9px;
  border: 1px solid var(--gold); border-radius: 999px 999px 8px 8px; opacity: .8;
}
.arch svg { width: 58%; height: auto; }
.portrait {
  width: min(60%, 210px); aspect-ratio: 1; border-radius: 50%; position: relative;
  background: var(--white); box-shadow: var(--shadow);
  padding: 8px; border: 1px solid var(--gold);
}
.portrait img { width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover; transform: scale(1.03); clip-path: circle(48.5%); }
.intro { text-align: center; }
.howto { gap: 0; border-top: 1px solid var(--line); }
.howto li { display: flex; gap: 16px; align-items: baseline; padding: 16px 2px; border-bottom: 1px solid var(--line); }
.howto .n { font-family: var(--font-latin); font-style: italic; font-size: 22px; color: var(--gold-deep); min-width: 20px; }
ol, ul { margin: 0; padding: 0; list-style: none; }
.card {
  background: var(--white); border-radius: var(--radius);
  padding: 26px 22px; box-shadow: var(--shadow);
}
.field { gap: 10px; }
.field label { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.1em; }
.input, .textarea {
  width: 100%; font: inherit; color: var(--brown); letter-spacing: 0.04em;
  background: var(--ivory); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; font-size: 16px;
}
.input:focus, .textarea:focus { outline: none; border-color: var(--gold-deep); background: var(--white); }
.textarea { min-height: 150px; resize: vertical; line-height: 1.8; }
.error { color: #9A4B4B; font-size: 13px; }

/* 一覧 */
.greet { font-family: var(--font-display); font-size: 19px; line-height: 1.7; }
.progress { gap: 12px; }
.progress .label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.progress .count { font-family: var(--font-latin); font-size: 26px; color: var(--gold-deep); letter-spacing: 0.08em; }
.keys { display: flex; gap: 6px; }
.keys span {
  flex: 1; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--white); border: 1px solid var(--line); color: var(--pink);
  transition: background .5s ease, color .5s ease, border-color .5s ease;
}
.keys span.on { background: var(--pink-soft); border-color: var(--gold); color: var(--gold-deep); }
.keys svg { width: 17px; height: 17px; }
.days { gap: 14px; }
.day {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 16px; align-items: center;
  width: 100%; text-align: left; padding: 12px 16px 12px 12px;
  background: var(--white); border: 1px solid transparent; border-radius: var(--radius);
  box-shadow: var(--shadow); transition: transform .2s ease, border-color .2s ease;
}
.day:active { transform: scale(0.99); }
.day.current { border-color: var(--gold); }
.day.locked { background: transparent; box-shadow: none; border: 1px dashed var(--line); }
.day.locked .thumb, .day.locked .txt { opacity: .5; }
.thumb {
  width: 76px; aspect-ratio: 1; border-radius: 14px; overflow: hidden;
  background: var(--pink-soft); display: grid; place-items: center; color: var(--gold);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb svg { width: 26px; height: 26px; }
.day .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.daynum { font-family: var(--font-latin); font-size: 13px; letter-spacing: 0.28em; color: var(--gold-deep); }
.day .ttl { font-family: var(--font-display); font-size: 16px; line-height: 1.5; }
.state { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--brown-soft); min-width: 40px; letter-spacing: 0.08em; }
.state svg { width: 20px; height: 20px; color: var(--gold-deep); }
.day.locked .state svg { color: var(--brown-soft); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 44px), 26rem);
  background: var(--brown); color: var(--ivory); border-radius: 16px;
  padding: 14px 18px; font-size: 13px; text-align: center; z-index: 20;
  animation: fadeUp .3s ease both;
}

/* 詳細 */
.dayhead { gap: 8px; text-align: center; align-items: center; }
.dayhead .big { font-family: var(--font-latin); font-size: 15px; letter-spacing: 0.4em; color: var(--gold-deep); }
.dayhead h1 { font-size: 25px; letter-spacing: 0.08em; }
.gallery {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  margin-inline: -22px; padding-inline: 22px; padding-bottom: 6px; scrollbar-width: none;
}
.gallery::-webkit-scrollbar { display: none; }
.shot { flex: 0 0 82%; scroll-snap-align: center; display: flex; flex-direction: column; gap: 8px; }
.shot:only-child { flex-basis: 100%; }
.frame {
  aspect-ratio: 1 / 1; max-width: 100%; border-radius: var(--radius); overflow: hidden; position: relative;
  background: linear-gradient(160deg, var(--pink-soft), var(--pink));
  display: grid; place-items: center; text-align: center; color: var(--brown-soft);
}
.frame::after { content: ""; position: absolute; inset: 10px; border: 1px solid var(--white); border-radius: 12px; opacity: .7; pointer-events: none; }
.frame img { width: 100%; height: 100%; object-fit: cover; }
/* 画像が入ったら、画像そのものの縦横比で表示（横長でも切れない） */
.frame.has-img { aspect-ratio: auto; display: block; background: var(--white); }
.frame.has-img img { height: auto; display: block; }
.frame .ph { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; padding: 20px; }
.frame .ph svg { width: 30px; height: 30px; color: var(--gold-deep); }
.shot figcaption { font-size: 12px; color: var(--brown-soft); text-align: center; }
figure { margin: 0; }
.section { gap: 14px; }
.section h2 { font-size: 17px; letter-spacing: 0.14em; display: flex; align-items: center; gap: 10px; }
.section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.steps { gap: 14px; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: baseline; }
.steps .n { font-family: var(--font-latin); font-style: italic; font-size: 22px; color: var(--gold-deep); line-height: 1; }
.points { gap: 8px; }
.points li { padding-left: 18px; position: relative; }
.points li::before { content: ""; position: absolute; left: 2px; top: 0.85em; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.caution { background: var(--pink-soft); border-radius: var(--radius); padding: 20px; gap: 8px; font-size: 13.5px; }
.caution h2 { font-size: 15px; }
.caution h2::after { background: var(--white); }
.review {
  border: 1px dashed var(--gold-deep); border-radius: 14px; padding: 12px 16px;
  font-size: 12.5px; color: var(--gold-deep); line-height: 1.7; background: var(--white);
}
.fb { gap: 16px; }
.fb h2 { font-size: 19px; text-align: center; }
.fb .lead { text-align: center; color: var(--brown-soft); font-size: 14px; }
.fb .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--brown-soft); }
.notice { font-size: 12px; line-height: 1.8; color: var(--brown-soft); border-top: 1px solid var(--line); padding-top: 14px; }
.mine { background: var(--ivory); border-radius: 14px; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }

/* 解放演出 */
.unlock { align-items: center; text-align: center; gap: 26px; padding-top: 8vh; }
.lockwrap { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
.lockwrap .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--gold); animation: ring 1.6s .5s ease-out both; }
.lockwrap .disc { position: absolute; inset: 22px; border-radius: 50%; background: var(--pink-soft); }
.lockwrap svg { position: relative; width: 64px; height: 64px; color: var(--gold-deep); overflow: visible; }
.shackle { transform-origin: 44px 30px; animation: shackle .9s .35s cubic-bezier(.3,1.4,.5,1) both; }
.spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: spark 1.4s .8s ease-out both; }
@keyframes shackle { from { transform: none; } to { transform: translateY(-7px) rotate(24deg); } }
@keyframes ring { from { transform: scale(.7); opacity: 0; } 40% { opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
@keyframes spark { from { opacity: 0; transform: translateY(6px) scale(.4); } 40% { opacity: 1; } to { opacity: 0; transform: translateY(-14px) scale(1); } }
.unlock .head { font-family: var(--font-display); font-size: 27px; letter-spacing: 0.14em; animation: fadeUp .7s .9s ease both; }
.unlock .head small { display: block; font-family: var(--font-latin); font-size: 13px; letter-spacing: 0.36em; color: var(--gold-deep); margin-bottom: 6px; }
.unlock .msg { animation: fadeUp .7s 1.15s ease both; max-width: 22em; }
.unlock .acts { width: 100%; gap: 6px; align-items: center; animation: fadeUp .7s 1.4s ease both; }

/* 完了 */
.fin { text-align: center; align-items: center; gap: 20px; }
.fin h1 { font-size: 26px; letter-spacing: 0.1em; }
.fin .keys { width: 100%; }
.donelist { gap: 0; border-top: 1px solid var(--line); }
.donelist button {
  width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center;
  padding: 14px 2px; min-height: 56px; text-align: left;
}
.donelist .ttl { font-family: var(--font-display); font-size: 15px; }
.donelist svg { width: 18px; height: 18px; color: var(--gold-deep); }
.oc { text-align: center; gap: 14px; align-items: center; }
.oc h2 { font-size: 18px; }
a.btn { text-decoration: none; }

.foot { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); gap: 8px; align-items: center; text-align: center; }
.confirm { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 16px; gap: 10px; width: 100%; font-size: 13px; }
.confirm .row { display: flex; gap: 10px; }
.confirm .btn { min-height: 46px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .shackle { transform: translateY(-7px) rotate(24deg); }
  .lockwrap .ring, .spark { display: none; }
}

/* ===== オープニング ===== */
.opening {
  position: fixed; inset: 0; z-index: 50; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 30%, var(--white) 0%, var(--ivory) 60%, var(--pink-soft) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px; transition: opacity .8s ease;
}
.opening.leaving { opacity: 0; pointer-events: none; }
.opening-skip {
  position: absolute; top: 14px; right: 16px; background: none; border: 0;
  font: 12px/1 var(--font-latin); letter-spacing: .2em; color: var(--brown-soft);
  padding: 10px 6px; cursor: pointer;
}
.opening-hook {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-family: var(--font-display); font-size: clamp(19px, 5.4vw, 26px); line-height: 2.1;
  letter-spacing: .14em; color: var(--brown); text-align: center; white-space: nowrap;
}
.opening-hook .line { display: block; opacity: 0; animation: introUp 1.1s ease forwards; }
.opening-hook .line:nth-child(2) { animation-delay: .7s; }
.opening-hook .ch { display: inline-block; white-space: pre; }
.opening-hook.sucking .line { opacity: 1; animation: none; }
.opening-hook.sucking .ch { animation: chSuck .9s ease-in var(--d) forwards; }
@keyframes introUp { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
/* 文字は動かさず、左から順に光に溶けて消える */
@keyframes chSuck {
  0%   { opacity: 1; color: var(--brown); text-shadow: none; filter: none; }
  30%  { opacity: 1; color: #B8925A; text-shadow: 0 0 6px rgba(255,236,196,.95), 0 0 14px rgba(214,172,100,.6); }
  60%  { opacity: .85; color: #FFF6E2; text-shadow: 0 0 10px #fff, 0 0 22px rgba(240,205,140,.9), 0 0 36px rgba(214,172,100,.5); filter: blur(.6px); }
  100% { opacity: 0; color: #fff; text-shadow: 0 0 16px #fff, 0 0 30px rgba(240,205,140,.6); filter: blur(5px); }
}
/* ティンカーベルの粉：きらめきながら同じ一点へ */
.dust {
  position: fixed; left: 0; top: 0; pointer-events: none; z-index: 3;
  width: var(--s); height: var(--s); border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #F6DFAE 30%, #D4B07A 55%, rgba(198,167,125,0) 78%);
  box-shadow: 0 0 calc(var(--s) * 1.8) calc(var(--s) * .5) rgba(214, 172, 100, .6);
  opacity: 0; animation: dustFly var(--dur) cubic-bezier(.5,0,.75,.4) var(--d) forwards, twinkle .28s steps(2) var(--d) infinite;
}
.dust.star {
  border-radius: 0; box-shadow: none; background: linear-gradient(135deg, #FFF6DC, #D9B169);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
  filter: drop-shadow(0 0 4px rgba(214, 172, 100, .9));
}
.dust.pink { background: radial-gradient(circle, #fff 0%, #F1C9CD 40%, #E3A9B0 58%, rgba(232,207,208,0) 78%); box-shadow: 0 0 calc(var(--s) * 1.6) rgba(225,160,170,.6); }
@keyframes dustFly {
  0%   { opacity: 0; transform: translate(var(--x), var(--y)) scale(.3); }
  12%  { opacity: 1; transform: translate(calc(var(--x) + var(--wx)), calc(var(--y) + var(--wy))) scale(1.15); }
  60%  { opacity: .95; transform: translate(calc(var(--x) + (var(--tx) - var(--x)) * .55 + var(--cx)), calc(var(--y) + (var(--ty) - var(--y)) * .55 + var(--cy))) scale(.8) rotate(90deg); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.1) rotate(200deg); }
}
@keyframes twinkle { 0% { filter: brightness(1.5); } 100% { filter: brightness(.75); } }
.opening-trio {
  display: flex; align-items: center; justify-content: center; gap: 0;
  width: 100%; max-width: 520px; margin-top: -4vh;
}
.opening-face {
  width: 31%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; flex: none;
  box-shadow: 0 12px 28px rgba(101, 86, 79, .14); border: 3px solid var(--white);
  opacity: 0; transform: scale(.4) translateY(30px);
}
.opening-face img { width: 104%; height: 104%; margin: -2%; object-fit: cover; display: block; }
.opening-face.c { width: 36%; z-index: 2; margin: 0 -3%; }
.opening-face.show { animation: facePop 1s cubic-bezier(.2,1.4,.4,1) forwards; }
.opening-face.settle { animation: none; opacity: 1; transform: none; transition: transform .9s ease; }
.opening-trio.lined .opening-face.settle { animation: floaty 3.6s ease-in-out infinite; }
.opening-trio.lined .opening-face.a.settle { animation-delay: .3s; }
.opening-trio.lined .opening-face.b.settle { animation-delay: .9s; }
@keyframes facePop { 0% { opacity: 0; transform: scale(.4) translateY(30px); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.opening-copy { text-align: center; margin-top: 34px; min-height: 120px; }
.opening-copy .main {
  font-family: var(--font-display); font-size: clamp(22px, 6.4vw, 30px); line-height: 1.75;
  letter-spacing: .14em; color: var(--brown);
}
.opening-copy .main span { display: block; opacity: 0; animation: introUp 1.2s ease forwards; }
.opening-copy .main span:nth-child(2) { animation-delay: .6s; }
@media (prefers-reduced-motion: reduce) {
  .opening *, .opening { animation-duration: .01s !important; animation-delay: 0s !important; transition: none !important; }
}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* =====================================================================
   1. 設定 ― タイトル・URL・文言はここだけ変えれば全画面に反映されます
   ===================================================================== */
const CONFIG = {
  title: "輪郭美人への7つの鍵",
  subtitle: "耳からはじめる、7ステップのセルフケア",
  openChatUrl: "",        // LINEオープンチャットのURL（未設定の間は「準備中」表示）
  noteUrl: "",            // 無料noteのURL（設定すると完了画面に導線が出ます）
  feedbackEndpoint: "",   // 本番の感想保存先（Googleスプレッドシート連携など）。空の間は送信しません
  isPreview: true,        // true の間は「公開前確認」メモと試作版の注意書きを表示
  storageKey: "rinkaku7keys:v1",
  feedbackMaxLength: 1000,
  publishNotice:

/* =====================================================================
   3. 保存 ― 「この端末への仮保存」と「サーバー保存」を分けています
   ===================================================================== */
// 3-a. この端末のブラウザ（localStorage）への保存。進捗の復元用。
//      別の端末への引き継ぎ・本人確認はできません。
const LocalProgress = {
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      const data = raw ? JSON.parse(raw) : null;
      return data && typeof data === "object" && data.feedback ? data : null;
    } catch (e) { return null; }
  },
  save(state) {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  },
  clear() { try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {} },
};

// 3-b. サーバーへの感想保存（本番機能・未接続）。
//      CONFIG.feedbackEndpoint を設定し、この関数の中身を実装すれば有効になります。
//      record の形はスプレッドシートの列にそのまま対応します。
const RemoteFeedback = {
  async send(record) {
    if (!CONFIG.feedbackEndpoint) return { sent: false, reason: "未接続（初期版）" };
    const res = await fetch(CONFIG.feedbackEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(record),
    });
    return { sent: res.ok };
  },
};

function newParticipantId() {
  try { if (crypto.randomUUID) return "p_" + crypto.randomUUID(); } catch (e) {}
  return "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function DayList({ state, onOpen, onComplete }) {
  const [toast, setToast] = useState("");
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  const count = Object.keys(state.feedback).length;
  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(""), 2800);
  };
  return html`<div className="view">
    <header className="stack" style=${{ gap: "6px" }}>
      <p className="eyebrow">${CONFIG.title}</p>
      <p className="greet">${state.nickname}さん、<br />今日も自分のための美容時間を♡</p>
    </header>

    <section className="stack progress">
      <div className="label">
        <span>あなたのチャレンジ</span>
        <span className="count">${count} / ${TOTAL}</span>
      </div>
      <${KeyRow} count=${count} />
    </section>

    ${count === TOTAL && html`<button className="btn ghost" onClick=${onComplete}>完了ページを見る</button>`}

    <ol className="stack days">
      ${DAYS.map((d) => {
        const done = !!state.feedback[d.day];
        const unlocked = d.day === 1 || !!state.feedback[d.day - 1];
        const cls = done ? "done" : unlocked ? "current" : "locked";
        return html`<li key=${d.day}>
          <button className=${"day " + cls} aria-disabled=${!unlocked}
            onClick=${() => unlocked ? onOpen(d.day) : showToast("前のステップの感想を送ると解放されます")}>
            <span className="thumb"><${Picture} image=${d.images[0]} className="thumb" /></span>
            <span className="txt">
              <span className="daynum">DAY ${d.day}</span>
              <span className="ttl">${d.title}</span>
            </span>
            <span className="state">
              ${done ? html`<${CheckIcon} />完了` : unlocked ? html`<${KeyIcon} />解放中` : html`<${LockIcon} />ロック中`}
            </span>
          </button>
        </li>`;
      })}
    </ol>
    ${toast && html`<div className="toast" role="status">${toast}</div>`}
  </div>`;
}

          <div className="stack" style=${{ gap: "8px" }}>
            <textarea id=${"feedback-day-" + day} className="textarea" maxLength=${CONFIG.feedbackMaxLength}
              aria-label="感想" placeholder="例：耳の後ろがじんわり温かくなって、気持ちよかったです。"
              value=${text} onChange=${(e) => { setText(e.target.value); setError(""); }} />
            <div className="meta">
              <span>${error && html`<span className="error" role="alert">${error}</span>`}</span>
              <span>${text.length} / ${CONFIG.feedbackMaxLength}</span>
            </div>
          </div>
          <button className="btn" type="submit" disabled=${sending || !text.trim()}>
            ${sending ? "送信中…" : day < TOTAL ? "感想を送って、次の鍵を開ける" : "感想を送って、最後の鍵を開ける"}
          </button>
          <p className="notice">${CONFIG.publishNotice}</p>
          ${CONFIG.isPreview && html`<p className="review">
            【試作版】感想はこの端末のブラウザ内にだけ保存され、運営には送信されません。掲載への同意も、まだ取得していない扱いです。
          </p>`}
        </form>`}
  </div>`;
}

/* ---- 画面④ 鍵の解放演出 ---- */
function Unlock({ day, onNext, onList }) {
  const last = day === TOTAL;
  return html`<div className="view stack unlock" role="status">
    <div className="lockwrap" aria-hidden="true">
      <span className="ring"></span><span className="disc"></span>
      <span className="spark" style=${{ left: "18px", top: "34px" }}></span>
      <span className="spark" style=${{ right: "20px", top: "24px", animationDelay: "1s" }}></span>
      <span className="spark" style=${{ right: "30px", bottom: "26px", animationDelay: "1.15s" }}></span>
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path className="shackle" d="M20 30v-8a12 12 0 0 1 24 0v8" />
        <rect x="13" y="30" width="38" height="26" rx="6" fill="#FFFFFF" />
        <path d="M32 40v6" />
      </svg>
    </div>
    <p className="head">
      <small>${last ? "All keys unlocked" : "Key unlocked"}</small>
      ${last ? "7つの鍵が、すべて開きました" : `DAY ${day + 1} 解放！`}
    </p>
    <p className="msg">${UNLOCK_MESSAGES[day]}</p>
    <div className="stack acts">
      <button className="btn" onClick=${onNext}>${last ? "完了ページへ" : `DAY ${day + 1} へ進む`}</button>
      ${!last && html`<button className="linkbtn" onClick=${onList}>一覧に戻る</button>`}
    </div>
  </div>`;
}

/* ---- 画面⑤ チャレンジ完了 ---- */
function Complete({ state, onOpen, onList }) {
  return html`<div className="view">
    <header className="stack fin">
      <p className="eyebrow">Congratulations</p>
      <h1>${state.nickname}さん、<br />7つの鍵がすべて開きました</h1>
      <${KeyRow} count=${TOTAL} />
      <p>7つのケアを最後まで続けたこと、心からお祝いします。<br />これからも、気が向いたときに自分に触れる時間を。</p>
    </header>

    <section className="stack section">
      <h2>開けた7つの鍵</h2>
      <ol className="stack donelist">
        ${DAYS.map((d) => html`<li key=${d.day}>
          <button onClick=${() => onOpen(d.day)}>
            <span className="daynum">DAY ${d.day}</span><span className="ttl">${d.title}</span><${CheckIcon} />
          </button>
        </li>`)}
      </ol>
      <button className="btn ghost" onClick=${onList}>ケアを振り返る</button>
    </section>

    <section className="card stack oc">
      <p className="eyebrow">Open Chat</p>
      <h2>感想や気づきを、<br />オープンチャットでも</h2>
      <p className="muted">続けるコツや日々のケアを、みなさんとご一緒に。</p>
      ${CONFIG.openChatUrl
        ? html`<a className="btn" href=${CONFIG.openChatUrl} target="_blank" rel="noopener">オープンチャットへ</a>`
        : html`<p className="review">【準備中】オープンチャットのURLを設定すると、ここにボタンが表示されます。</p>`}
      ${CONFIG.noteUrl && html`<a className="btn ghost" href=${CONFIG.noteUrl} target="_blank" rel="noopener">無料noteを読む</a>`}
    </section>

}

/* ---- フッター（やり直し） ---- */
function Footer({ onReset, storageOk }) {
  const [asking, setAsking] = useState(false);
  return html`<footer className="stack foot">
    ${!storageOk && html`<p className="error">この環境では進み具合を保存できません。ページを閉じると最初からになります。</p>`}
    <p className="muted">進み具合はこの端末のブラウザにのみ保存されています。</p>
    ${asking
      ? html`<div className="stack confirm">
          <p>ニックネームと進み具合、感想の記録をこの端末から消去します。元には戻せません。</p>
          <div className="row">
            <button className="btn ghost" onClick=${() => setAsking(false)}>やめる</button>
            <button className="btn" onClick=${() => { setAsking(false); onReset(); }}>消去する</button>
          </div>
        </div>`
      : html`<button className="linkbtn" onClick=${() => setAsking(true)}>最初からやり直す</button>`}
  </footer>`;
}

/* ---- アプリ本体 ---- */
// ===== オープニング（TOPの前に毎回表示。スキップ可） =====
const INTRO_COPY = {
  hook: ["「もう年だから」って、", "あきらめていませんか。"],
  main: ["その横顔、", "もっと好きになれる。"],
};
const INTRO_FACES = [
  { key: "a", src: "images/intro-a.jpg" },   // 左
  { key: "c", src: "images/intro-c.jpg" },   // 真ん中
  { key: "b", src: "images/intro-b.jpg" },   // 右
];
// 登場順：右 → 左 → 真ん中
const FACE_ORDER = { b: 0, a: 1, c: 2 };
const AUTO_EXIT_MS = 16000;   // オープニング開始から自動でTOPへ移るまで

function Intro({ onDone }) {
  const reduce = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [t, setT] = useState(reduce ? 99 : 0);   // 経過ステージ
  const [leaving, setLeaving] = useState(false);
  const [fx, setFx] = useState(null);            // 吸い込み演出（文字の移動量・粉・吸い込み口）
  const hookRef = useRef(null);
  const finishRef = useRef(() => {});
  useEffect(() => {
    if (reduce) { const id = setTimeout(() => finishRef.current(), 4000); return () => clearTimeout(id); }
    // 0:文字表示 1:光に溶ける 2:右 3:左 4:真ん中 5:整列 6:コピー
    const marks = [2900, 5200, 5800, 6400, 7500, 8000];
    const ids = marks.map((ms, i) => setTimeout(() => setT(i + 1), ms));
    // コピーが出そろって少し余韻をおいたら、自動でTOPへ
    ids.push(setTimeout(() => finishRef.current(), AUTO_EXIT_MS));
    return () => ids.forEach(clearTimeout);
  }, []);
  // 消える演出の開始時に、各文字の位置を測って順番と粉を決める
  React.useLayoutEffect(() => {
    if (t !== 1 || !hookRef.current) return;
    const chars = [...hookRef.current.querySelectorAll(".ch")];
    const rects = chars.map((el) => el.getBoundingClientRect());
    const minX = Math.min(...rects.map((r) => r.left)), maxX = Math.max(...rects.map((r) => r.right));
    const span = Math.max(1, maxX - minX), SWEEP = 1.2;     // 左端から右端まで消えていく時間（秒）
    const R = (a, b) => a + Math.random() * (b - a);
    const dust = [];
    chars.forEach((el, i) => {
      const r = rects[i];
      const d = ((r.left + r.width / 2 - minX) / span) * SWEEP;   // 左から順に
      el.style.setProperty("--d", d.toFixed(3) + "s");
      // 消える瞬間に、その場からきらめく粉がふわりと舞い上がる
      for (let k = 0; k < 5; k++) {
        const x = R(r.left, r.right), y = R(r.top, r.bottom);
        const kind = Math.random();
        dust.push({
          cls: kind < 0.3 ? "dust star" : kind < 0.45 ? "dust pink" : "dust",
          s: (kind < 0.3 ? R(6, 11) : R(2.5, 5.5)).toFixed(1),
          x: x.toFixed(1), y: y.toFixed(1),
          tx: (x + R(10, 70)).toFixed(1), ty: (y - R(40, 130)).toFixed(1),
          wx: R(-6, 6).toFixed(1), wy: R(-10, 2).toFixed(1),
          cx: R(-15, 15).toFixed(1), cy: R(-10, 10).toFixed(1),
          d: (d + R(0.15, 0.5)).toFixed(3), dur: R(1.0, 1.7).toFixed(2),
        });
      }
    });
    setFx({ dust });
  }, [t]);
  const doneRef = useRef(false);
  const finish = () => { if (doneRef.current) return; doneRef.current = true; setLeaving(true); setTimeout(onDone, 750); };
  finishRef.current = finish;
  const faceCls = (k) => {
    const shownAt = 2 + FACE_ORDER[k];
    if (t >= 5) return "opening-face " + k + " settle";
    return "opening-face " + k + (t >= shownAt ? " show" : "");
  };
  return html`<div className=${"opening" + (leaving ? " leaving" : "")} role="dialog" aria-label="オープニング">
    <button className="opening-skip" onClick=${finish}>SKIP</button>
    ${t <= 1 && html`<div ref=${hookRef} className=${"opening-hook" + (t === 1 && fx ? " sucking" : "")} aria-hidden=${t === 1}>
      ${INTRO_COPY.hook.map((l) => html`<span className="line" key=${l}>${[...l].map((c, i) => html`<span className="ch" key=${i}>${c}</span>`)}</span>`)}
    </div>`}
    ${t === 1 && fx && fx.dust.map((p, i) => html`<i key=${i} className=${p.cls} style=${{
      "--s": p.s + "px", "--x": p.x + "px", "--y": p.y + "px", "--tx": p.tx + "px", "--ty": p.ty + "px",
      "--wx": p.wx + "px", "--wy": p.wy + "px", "--cx": p.cx + "px", "--cy": p.cy + "px",
      "--d": p.d + "s", "--dur": p.dur + "s" }}></i>`)}
    ${t >= 2 && html`<div className=${"opening-trio" + (t >= 5 ? " lined" : "")}>
      ${INTRO_FACES.map((f) => html`<div key=${f.key} className=${faceCls(f.key)}><img src=${f.src} alt="" /></div>`)}
    </div>`}
    ${t >= 2 && html`<div className="opening-copy">
      ${t >= 6 && html`<p className="main">${INTRO_COPY.main.map((l) => html`<span key=${l}>${l}</span>`)}</p>`}
    </div>`}
  </div>`;
}

function App() {
  const [state, setState] = useState(() => LocalProgress.load());
  const [storageOk, setStorageOk] = useState(true);
  const [view, setView] = useState(() => {
    const s = LocalProgress.load();
    if (!s) return { name: "welcome" };
    return Object.keys(s.feedback).length === TOTAL ? { name: "complete" } : { name: "list" };
  });

  useEffect(() => { if (state) setStorageOk(LocalProgress.save(state)); }, [state]);
  useEffect(() => { try { window.scrollTo(0, 0); } catch (e) {} }, [view]);

  const [showIntro, setShowIntro] = useState(true);
  const go = useCallback((name, day) => setView({ name, day }), []);

  const start = (nickname) => {
    setState({ participantId: newParticipantId(), nickname, startedAt: new Date().toISOString(), feedback: {} });
    go("list");
  };

  const submitFeedback = async (day, text) => {
    if (!state || state.feedback[day]) return;            // すでに送信済みなら何もしない
    if (day !== 1 && !state.feedback[day - 1]) return;     // 順番を飛ばせない
    const record = {
      participantId: state.participantId,
      nickname: state.nickname,
      day,
      text,
      submittedAt: new Date().toISOString(),
      publishConsent: "not_obtained",   // 掲載同意：未取得（本番前に取得方法を確定）
    };
    let remote = { sent: false };
    try { remote = await RemoteFeedback.send(record); } catch (e) { remote = { sent: false, reason: "送信エラー" }; }
    setState((prev) => prev.feedback[day] ? prev : {
      ...prev,
      feedback: { ...prev.feedback, [day]: { ...record, sentToServer: !!remote.sent } },
    });
    go("unlock", day);
  };

  const reset = () => { LocalProgress.clear(); setState(null); go("welcome"); };

  let screen;
  if (!state || view.name === "welcome") screen = html`<${Welcome} onStart=${start} />`;
  else if (view.name === "day") screen = html`<${DayDetail} key=${view.day} day=${view.day} state=${state}
    onBack=${() => go("list")} onSubmit=${submitFeedback} onOpen=${(n) => go("day", n)} />`;
  else if (view.name === "unlock") screen = html`<${Unlock} key=${view.day} day=${view.day}
    onNext=${() => view.day === TOTAL ? go("complete") : go("day", view.day + 1)} onList=${() => go("list")} />`;
  else if (view.name === "complete") screen = html`<${Complete} state=${state} onOpen=${(n) => go("day", n)} onList=${() => go("list")} />`;
  else screen = html`<${DayList} state=${state} onOpen=${(n) => go("day", n)} onComplete=${() => go("complete")} />`;

  return html`<main className="app">
    ${showIntro && html`<${Intro} onDone=${() => setShowIntro(false)} />`}
    ${screen}
    ${state && view.name !== "unlock" && html`<${Footer} onReset=${reset} storageOk=${storageOk} />`}
  </main>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
